name: smart_data_organizer
description: AI-powered Excel-like Data Cleaner for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  file_picker: ^8.1.7
  path_provider: ^2.1.5
  path: ^1.9.0

  excel: ^4.0.6
  csv: ^6.0.0

  pluto_grid: ^8.0.0

  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3

  pdf: ^3.11.1
  printing: ^5.14.2
  share_plus: ^10.1.2

  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1

  animate_do: ^3.3.4
  dotted_border: ^2.1.0

  permission_handler: ^12.0.0+1
  google_mobile_ads: ^5.2.0

  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
